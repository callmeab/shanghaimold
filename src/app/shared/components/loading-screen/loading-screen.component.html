<div class="loading-wrapper" [class.fade-out]="isFadingOut" *ngIf="isVisible">
  <div class="loading-content">
    
    <!-- Animated Logo -->
    <div class="logo-container">
      <div class="logo-shape primary"></div>
      <div class="logo-shape secondary"></div>
      <span class="logo-text">Shanghai Mold</span>
    </div>
    
    <!-- Progress Bar -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
    <span class="loading-text">Initializing digital environment...</span>
    
  </div>
</div>
